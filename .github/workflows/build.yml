name: Build

on: pull_request

env:
  NODE_VERSION: 24.x
  GO_VERSION: '1.26'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Types
        run: npm run lint:types
      - name: Lint
        run: npm run lint:code
      - name: Format
        run: npm run lint:format

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum
      - name: Install unixODBC
        # A bare apt-get can sit for hours: it waits on the dpkg lock behind the
        # runner's own background updates, and stalls when a mirror does. The
        # x64 runners' azure mirror does exactly that often enough to matter, so
        # it is swapped for the canonical archive, and the update is retried
        # rather than given one long timeout, which a stall does not survive.
        timeout-minutes: 12
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list || true
          for attempt in 1 2 3; do
            if timeout 150 sudo apt-get update -o Acquire::Retries=3; then break; fi
            echo "apt-get update did not finish, retrying ($attempt)"
          done
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -o Acquire::Retries=3 unixodbc-dev
      - name: Format
        run: test -z "$(gofmt -l .)"
        working-directory: go
      - name: Vet
        run: go vet ./...
        working-directory: go
      - name: Test
        run: go test ./...
        working-directory: go

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum
      - name: Install unixODBC (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install unixodbc
      - name: Install unixODBC (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        # A bare apt-get can sit for hours: it waits on the dpkg lock behind the
        # runner's own background updates, and stalls when a mirror does. The
        # x64 runners' azure mirror does exactly that often enough to matter, so
        # it is swapped for the canonical archive, and the update is retried
        # rather than given one long timeout, which a stall does not survive.
        timeout-minutes: 12
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list || true
          for attempt in 1 2 3; do
            if timeout 150 sudo apt-get update -o Acquire::Retries=3; then break; fi
            echo "apt-get update did not finish, retrying ($attempt)"
          done
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -o Acquire::Retries=3 unixodbc-dev
      - name: Install npm dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify the package contents
        run: npm pack --dry-run
