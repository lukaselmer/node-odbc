name: CI

on:
  pull_request:
  push:
    branches: [main, 'alpha/**']

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install unixODBC
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  javascript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The constants are generated from the Rust source rather than the built
      # addon, so this job needs neither a toolchain nor a driver manager.
      - run: npm run build:ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Tests against PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: odbc
          POSTGRES_PASSWORD: odbc
          POSTGRES_DB: odbctest
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install unixODBC and the PostgreSQL driver
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev odbc-postgresql

      - name: Register the data source
        run: |
          cat <<'INI' > "$HOME/.odbc.ini"
          [PGTEST]
          Driver      = PostgreSQL Unicode
          Servername  = localhost
          Port        = 5432
          Database    = odbctest
          INI

      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          DBMS: postgres
          CONNECTION_STRING: DSN=PGTEST;UID=odbc;PWD=odbc
          DB_SCHEMA: public
          DB_TABLE: odbctests
          DB_USERNAME: odbc

  artefacts:
    name: Artefact ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-x64 }
          - { os: macos-latest, platform: darwin-arm64 }
          - { os: windows-latest, platform: win32-x64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install unixODBC
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev
      - name: Install unixODBC
        if: runner.os == 'macOS'
        run: brew install unixodbc
      # Windows needs no step: the driver manager is part of the OS.

      - run: npm ci
      - run: npm run build
      - run: npm run build:ts

      # Every platform we publish a prebuild for is built and loaded here, so a
      # release cannot be the first time one of them is tried.
      - name: Check the addon loads
        run: node -e "const a = require('./prebuilds/${{ matrix.platform }}/odbc.node'); if (typeof a.connect !== 'function') throw new Error('connect is missing')"

      - uses: actions/upload-artifact@v7
        with:
          name: odbc-${{ matrix.platform }}
          path: prebuilds/${{ matrix.platform }}/odbc.node
          if-no-files-found: error
