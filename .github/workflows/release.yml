name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # OIDC, for npm trusted publishing

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install unixODBC
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev

      - run: npm ci

      - name: Check the tag matches the version
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(node -p 'require("./package.json").version')"
          if [ "$tagged" != "$declared" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $declared" >&2
            exit 1
          fi

      # Linux x64 is the only platform we deploy to; everything else builds from
      # source, which package.json ships the crate for.
      - name: Build the addon
        run: npm run build

      - name: Check the artefact is a Linux x64 addon
        run: file prebuilds/linux-x64/odbc.node | grep -q 'ELF 64-bit LSB shared object, x86-64'

      - name: Build the JavaScript
        run: npm run build:ts

      - name: Verify the package before publishing
        run: cargo test && npm run typecheck && npm run lint

      # Importing the entry point loads the addon at module scope, so this fails
      # here rather than on a user's machine if the artefact or loader is wrong.
      - name: Check the built package loads
        run: node -e "import('./dist/index.js').then(m => { if (typeof m.connect !== 'function') throw new Error('connect is missing') })"

      - name: Choose the dist-tag
        run: .github/npm-tag.sh "$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"

      # Without OIDC support npm falls back to token auth, which on a scoped
      # package surfaces as a 404 rather than anything naming the cause.
      - name: Check npm supports trusted publishing
        run: |
          installed="$(npm -v)"
          if [ "$(printf '11.5.1\n%s\n' "$installed" | sort -V | head -1)" != "11.5.1" ]; then
            echo "npm $installed is too old for trusted publishing; 11.5.1 or later is required" >&2
            exit 1
          fi
          echo "npm $installed supports trusted publishing"

      # No NODE_AUTH_TOKEN: the package is published through npm trusted
      # publishing, which exchanges the OIDC token above for a short-lived
      # credential. Provenance is generated automatically, so --provenance
      # is not passed.
      - name: Publish to npm
        run: npm publish --tag "$tag"

      - name: Attach the artefact to the release
        uses: softprops/action-gh-release@v3
        with:
          files: prebuilds/linux-x64/odbc.node
          generate_release_notes: true
          prerelease: ${{ env.tag != 'latest' }}
