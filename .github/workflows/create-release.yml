name: Create Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # OIDC, for npm trusted publishing

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-x64 }
          - { os: macos-latest, platform: darwin-arm64 }
          - { os: windows-latest, platform: win32-x64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # A bare apt-get can sit for hours: it waits on the dpkg lock behind the
      # runner's own background updates, and prompts when a mirror stalls.
      - name: Install unixODBC
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -o Acquire::Retries=3 unixodbc-dev
      - name: Install unixODBC
        if: runner.os == 'macOS'
        run: brew install unixodbc
      # Windows needs no step: the driver manager is part of the OS.

      - run: npm ci
      - run: npm run build

      - name: Run the Rust tests
        run: cargo test

      # Loading it is stronger than matching magic bytes: it proves the addon
      # links against the driver manager on the platform it was built for.
      - name: Check the addon loads
        run: node -e "const a = require('./prebuilds/${{ matrix.platform }}/odbc.node'); if (typeof a.connect !== 'function') throw new Error('connect is missing')"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: prebuilds/${{ matrix.platform }}/odbc.node
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Check the tag matches the version
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(node -p 'require("./package.json").version')"
          if [ "$tagged" != "$declared" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $declared" >&2
            exit 1
          fi

      # One artefact per platform, each named after the directory it belongs in.
      - uses: actions/download-artifact@v7
        with:
          path: prebuilds

      - name: Check every platform arrived
        run: |
          for platform in linux-x64 darwin-arm64 win32-x64; do
            test -f "prebuilds/$platform/odbc.node" || {
              echo "prebuilds/$platform/odbc.node is missing" >&2
              exit 1
            }
          done
          ls -l prebuilds/*/odbc.node

      - name: Build the JavaScript
        run: npm run build:ts

      - name: Verify the package before publishing
        run: npm run typecheck && npm run lint

      - name: Check the built package loads
        run: node -e "import('./dist/index.js').then(m => { if (typeof m.connect !== 'function') throw new Error('connect is missing') })"

      - name: Choose the dist-tag
        run: .github/npm-tag.sh "$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"

      # Without OIDC support npm falls back to token auth, which on a scoped
      # package surfaces as a 404 rather than anything naming the cause.
      - name: Check npm supports trusted publishing
        run: |
          installed="$(npm -v)"
          if [ "$(printf '11.5.1\n%s\n' "$installed" | sort -V | head -1)" != "11.5.1" ]; then
            echo "npm $installed is too old for trusted publishing; 11.5.1 or later is required" >&2
            exit 1
          fi
          echo "npm $installed supports trusted publishing"

      # npm's OIDC exchange is written never to throw: every failure path returns
      # quietly and logs below the default level, then falls back to token auth
      # and surfaces as an unrelated 404. --loglevel verbose is what makes the
      # actual cause visible.
      - name: Publish to npm
        run: npm publish --tag "$tag" --loglevel verbose

      - name: Name the artefacts after their platform
        run: |
          mkdir -p release
          for platform in linux-x64 darwin-arm64 win32-x64; do
            cp "prebuilds/$platform/odbc.node" "release/odbc-$platform.node"
          done

      - name: Attach the artefacts to the release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*.node
          generate_release_notes: true
          prerelease: ${{ env.tag != 'latest' }}
