name: Create Release

on:
  push:
    tags: ['v*']

permissions:
  id-token: write # Required for OIDC
  contents: write # Required for action-gh-release

env:
  NODE_VERSION: 24.x
  GO_VERSION: '1.26'

jobs:
  # The sidecar is a compiled binary, so every supported platform builds its
  # own and the release job collects them into one package.
  build-server:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-latest
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum
      - name: Install unixODBC (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install unixodbc
      - name: Install unixODBC (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        # A bare apt-get can sit for hours: it waits on the dpkg lock behind the
        # runner's own background updates, and stalls when a mirror does. The
        # x64 runners' azure mirror does exactly that often enough to matter, so
        # it is swapped for the canonical archive, and the update is retried
        # rather than given one long timeout, which a stall does not survive.
        timeout-minutes: 12
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list || true
          for attempt in 1 2 3; do
            if timeout 150 sudo apt-get update -o Acquire::Retries=3; then break; fi
            echo "apt-get update did not finish, retrying ($attempt)"
          done
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -o Acquire::Retries=3 unixodbc-dev
      - name: Build the sidecar
        run: npm run build:server
      - uses: actions/upload-artifact@v5
        with:
          name: server-${{ matrix.platform }}
          path: bin/${{ matrix.platform }}/

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - name: Upgrade npm
        # Publishing without a token needs the OIDC support in npm 11.5.1+.
        run: npm install -g npm@latest
      - name: Install npm dependencies
        run: npm ci
      - name: Collect the sidecar binaries
        uses: actions/download-artifact@v8
        with:
          path: bin
          pattern: server-*
      - name: Name the binaries by platform
        run: |
          cd bin
          for directory in server-*; do
            mv "$directory" "${directory#server-}"
          done
          ls -R
      - name: Restore the executable bit
        # Artifacts travel as zip archives, which do not carry Unix permissions.
        run: chmod +x bin/*/node-odbc-server
      - name: Verify a binary exists for every platform
        run: |
          for platform in linux-x64 linux-arm64 darwin-arm64 darwin-x64; do
            test -x "bin/$platform/node-odbc-server" || {
              echo "Missing the sidecar for $platform"; exit 1;
            }
          done
      - name: Build the package
        run: npm run build:types
      - name: Read the version
        id: package-version
        run: jq -r '"version=" + .version' package.json >> "$GITHUB_OUTPUT"
      - name: Read the npm tag
        id: package-tag
        run: .github/npm-tag.sh "$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
        env:
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.package-version.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ steps.package-tag.outputs.tag != 'latest' }}
      - name: Publish to npm
        # Authenticated through OIDC: the package is configured on npm with
        # this repository and workflow as a trusted publisher.
        run: npm publish --access public --provenance --tag "$NPM_TAG"
        env:
          NPM_TAG: ${{ steps.package-tag.outputs.tag }}
